<style>
  :root { color-scheme: dark; }
  html { -webkit-text-size-adjust:100%; }
  body { margin:0; padding:0; background:#06090D; color:#ECF2F8; font:14px system-ui,-apple-system,"Segoe UI",sans-serif; }
  img { max-width:100%; }
  [hidden]:not([hidden="until-found"]) { display:none !important; }
</style>
<title>Asistente Operativo</title>
</head>
<body>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" media="print" onload="this.media='all';this.onload=null"
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  /* ===== tema: OSCURO por defecto, siempre. El claro solo si se pide. ===== */
  :root {
    color-scheme: dark;
    --bg:#06090D; --bg-2:#090D13; --surface:#0E1319; --surface-2:#141A22; --surface-3:#1B232D; --surface-4:#232D39;
    --glass:rgba(14,19,25,.78);
    --border:#1A222C; --border-2:#28333F; --border-3:#384655;
    --ink:#ECF2F8; --ink-2:#B3C2D0; --muted:#94A4B4; --faint:#8494A4;
    --brand:#3DDC97; --brand-2:#2BC5D4; --brand-ink:#04231A;
    --brand-soft:rgba(61,220,151,.12); --brand-line:rgba(61,220,151,.30);
    --urgente:#FF6B5A; --urgente-soft:rgba(255,107,90,.13);
    --importante:#FFB84D; --importante-soft:rgba(255,184,77,.13);
    --Logistica:#3D8EE8; --Operaciones:#A874E0; --Cheques:#B88A28; --neutro:#4E5C6A;
    --danger:#FF6B5A;
    --sh-1:0 1px 2px rgba(0,0,0,.45);
    --sh-2:0 6px 26px rgba(0,0,0,.38);
    --sh-3:0 28px 70px rgba(0,0,0,.62);
    --ring:0 0 0 3px var(--brand-soft);
    --hair:inset 0 1px 0 rgba(255,255,255,.045);
    --r-xs:9px; --r-sm:11px; --r:14px; --r-lg:18px; --r-xl:24px;
    --nav-h:64px; --side-w:252px; --rail-w:322px;
  }
  :root[data-ui="light"] {
    color-scheme: light;
    --bg:#F2F5F9; --bg-2:#E9EEF5; --surface:#FFFFFF; --surface-2:#F5F8FC; --surface-3:#EAF0F7; --surface-4:#DFE8F1;
    --glass:rgba(255,255,255,.84);
    --border:#E1E9F1; --border-2:#CEDAE6; --border-3:#B6C6D6;
    --ink:#0B131C; --ink-2:#38485A; --muted:#5A6D80; --faint:#66788B;
    --brand:#0B9C6D; --brand-2:#0E8AA2; --brand-ink:#FFFFFF;
    --brand-soft:rgba(11,156,109,.10); --brand-line:rgba(11,156,109,.32);
    --urgente:#D33E29; --urgente-soft:rgba(211,62,41,.09);
    --importante:#96620A; --importante-soft:rgba(150,98,10,.10);
    --Logistica:#2563EB; --Operaciones:#7C3AED; --Cheques:#B07711; --neutro:#94A6B8;
    --danger:#C12C1C;
    --sh-1:0 1px 2px rgba(15,30,45,.06);
    --sh-2:0 6px 22px rgba(15,30,45,.08);
    --sh-3:0 28px 70px rgba(15,30,45,.20);
    --hair:inset 0 1px 0 rgba(255,255,255,.7);
  }

  * { box-sizing:border-box; }
  html,body { height:100%; }
  body {
    background:var(--bg); color:var(--ink);
    font-family:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
    font-size:14.5px; line-height:1.5; letter-spacing:-.005em;
    padding:0; -webkit-tap-highlight-color:transparent; overflow-x:hidden;
  }
  h1,h2,h3 { margin:0; font-weight:700; letter-spacing:-.026em; }
  button,input,select,textarea { font:inherit; color:inherit; letter-spacing:inherit; }
  button { cursor:pointer; background:none; border:none; padding:0; color:inherit; }
  .num { font-variant-numeric:tabular-nums; }
  :focus-visible { outline:2px solid var(--brand); outline-offset:2px; border-radius:7px; }
  ::-webkit-scrollbar { width:9px; height:9px; }
  ::-webkit-scrollbar-thumb { background:var(--border-2); border-radius:9px; }
  ::-webkit-scrollbar-thumb:hover { background:var(--border-3); }
  ::-webkit-scrollbar-track { background:transparent; }
  ::selection { background:var(--brand-soft); }

  svg.ic { width:20px; height:20px; stroke:currentColor; fill:none; stroke-width:1.7; stroke-linecap:round; stroke-linejoin:round; flex:none; }
  svg.ic.sm { width:15px; height:15px; stroke-width:1.9; }
  svg.ic.xs { width:12.5px; height:12.5px; stroke-width:2.05; }

  /* ===== botones: un solo sistema ===== */
  .btn {
    --bh:42px;
    height:var(--bh); padding:0 16px; border-radius:12px; font-size:14px; font-weight:650;
    border:1px solid var(--border-2); background:var(--surface-2); color:var(--ink);
    display:inline-flex; align-items:center; justify-content:center; gap:8px;
    box-shadow:var(--hair); position:relative; overflow:hidden;
    transition:background .16s ease, border-color .16s ease, transform .12s ease, box-shadow .16s ease, color .16s;
  }
  .btn:hover { background:var(--surface-3); border-color:var(--border-3); }
  .btn:active { transform:scale(.975); }
  .btn.sm { --bh:34px; padding:0 12px; font-size:13px; border-radius:10px; }
  .btn.full { width:100%; }
  .btn.primary {
    background:linear-gradient(140deg,var(--brand),var(--brand-2)); border-color:transparent; color:var(--brand-ink);
    box-shadow:0 2px 14px var(--brand-soft), inset 0 1px 0 rgba(255,255,255,.22);
  }
  .btn.primary:hover { filter:brightness(1.08); box-shadow:0 4px 20px var(--brand-soft), inset 0 1px 0 rgba(255,255,255,.28); }
  .btn.ghost { background:transparent; border-color:transparent; color:var(--ink-2); box-shadow:none; }
  .btn.ghost:hover { background:var(--surface-2); color:var(--ink); }
  .btn.danger { color:var(--danger); border-color:transparent; background:transparent; box-shadow:none; }
  .btn.danger:hover { background:var(--urgente-soft); }
  .btn:disabled { opacity:.42; cursor:not-allowed; transform:none; }
  .btnrow { display:flex; gap:9px; flex-wrap:wrap; }

  .iconbtn {
    width:38px; height:38px; border-radius:12px; display:grid; place-items:center; flex:none;
    color:var(--ink-2); border:1px solid transparent; background:transparent;
    transition:background .16s, color .16s, transform .12s, border-color .16s;
  }
  .iconbtn:hover { background:var(--surface-2); color:var(--ink); }
  .iconbtn:active { transform:scale(.92); }
  .iconbtn.solid { background:var(--surface); border-color:var(--border); box-shadow:var(--hair); }
  .iconbtn.solid:hover { border-color:var(--border-2); background:var(--surface-2); }
  .iconbtn.xs { width:30px; height:30px; border-radius:9px; }

  .chip {
    height:34px; padding:0 13px; border-radius:99px; font-size:13px; font-weight:600;
    border:1px solid var(--border-2); background:var(--surface-2); color:var(--muted);
    display:inline-flex; align-items:center; gap:6px; box-shadow:var(--hair);
    transition:all .15s ease;
  }
  .chip:hover { color:var(--ink); border-color:var(--border-3); transform:translateY(-1px); }
  .chip:active { transform:scale(.97); }
  .chip[aria-pressed="true"] { background:var(--ink); color:var(--bg); border-color:var(--ink); }
  .chip.u[aria-pressed="true"] { background:var(--urgente); border-color:var(--urgente); color:#fff; }
  .chip.i[aria-pressed="true"] { background:var(--importante); border-color:var(--importante); color:#fff; }
  .chip.ar[aria-pressed="true"] { background:var(--ch); border-color:var(--ch); color:#fff; }
  .chip .dot { width:7px; height:7px; border-radius:50%; }
  .chips { display:flex; flex-wrap:wrap; gap:7px; }

  .seg { display:inline-flex; background:var(--surface-2); border-radius:11px; padding:3px; gap:2px; border:1px solid var(--border); box-shadow:var(--hair); position:relative; }
  .seg button { padding:6px 13px; border-radius:8px; font-size:12.5px; font-weight:650; color:var(--muted); transition:color .18s; position:relative; z-index:1; }
  .seg button[aria-pressed="true"] { color:var(--ink); }
  .seg .thumb { position:absolute; top:3px; bottom:3px; border-radius:8px; background:var(--surface); box-shadow:var(--sh-1),var(--hair); transition:left .26s cubic-bezier(.32,.72,0,1), width .26s cubic-bezier(.32,.72,0,1); z-index:0; }

  /* ===== layout ===== */
  .app { display:flex; min-height:100%; }
  aside.side {
    display:none; width:var(--side-w); flex:none; position:sticky; top:env(safe-area-inset-top,0px);
    height:100dvh; padding:18px 12px 14px; background:var(--bg-2); border-right:1px solid var(--border);
    flex-direction:column; gap:4px;
  }
  .brand { display:flex; align-items:center; gap:11px; padding:4px 8px 18px; }
  .logo {
    width:36px; height:36px; border-radius:12px; flex:none; display:grid; place-items:center;
    background:linear-gradient(140deg,var(--brand),var(--brand-2)); color:var(--brand-ink);
    box-shadow:0 5px 18px var(--brand-soft), inset 0 1px 0 rgba(255,255,255,.3);
  }
  .logo svg { width:20px; height:20px; stroke:currentColor; fill:none; stroke-width:2.1; stroke-linecap:round; stroke-linejoin:round; }
  .brand .bt { font-weight:800; font-size:15px; letter-spacing:-.035em; line-height:1.2; }
  .brand .bs { font-size:12px; color:var(--muted); font-weight:500; }

  .navlist { display:flex; flex-direction:column; gap:2px; }
  .navitem {
    display:flex; align-items:center; gap:11px; padding:10px 11px; border-radius:11px;
    color:var(--muted); font-size:14px; font-weight:550; width:100%; text-align:left; position:relative;
    transition:background .16s, color .16s, padding-left .2s;
  }
  .navitem:hover { background:var(--surface-2); color:var(--ink-2); padding-left:14px; }
  .navitem[aria-current="page"] { background:var(--surface-2); color:var(--ink); font-weight:700; box-shadow:var(--hair); }
  .navitem[aria-current="page"]::before {
    content:""; position:absolute; left:-12px; top:50%; transform:translateY(-50%);
    width:3px; height:22px; border-radius:0 3px 3px 0; background:var(--brand); box-shadow:0 0 12px var(--brand);
  }
  .navitem .badge {
    margin-left:auto; font-size:12px; font-weight:800; padding:1.5px 7px; border-radius:99px;
    background:var(--surface-3); color:var(--ink-2); font-variant-numeric:tabular-nums;
  }
  .navitem .badge.hot { background:var(--urgente-soft); color:var(--urgente); }
  .side .grow { flex:1; }

  .meter-card { background:var(--surface); border:1px solid var(--border); border-radius:var(--r); padding:12px; box-shadow:var(--hair); }
  .meter-card .mt { font-size:12px; color:var(--muted); font-weight:700; letter-spacing:.06em; text-transform:uppercase; display:flex; justify-content:space-between; }
  .meter { height:5px; border-radius:99px; background:var(--surface-3); margin:9px 0 6px; overflow:hidden; }
  .meter i { display:block; height:100%; border-radius:99px; background:linear-gradient(90deg,var(--brand),var(--brand-2)); transition:width .7s cubic-bezier(.22,1,.36,1); }
  .meter-card .ms { font-size:12px; color:var(--muted); font-variant-numeric:tabular-nums; }

  .main { flex:1; min-width:0; display:flex; flex-direction:column; }
  .topbar {
    position:sticky; top:env(safe-area-inset-top,0px); z-index:30;
    background:var(--glass); backdrop-filter:saturate(1.8) blur(18px);
    border-bottom:1px solid var(--border); padding:10px 16px; display:flex; align-items:center; gap:9px;
  }
  .mlogo { display:flex; }
  .searchbar {
    flex:1; max-width:540px; display:flex; align-items:center; gap:9px; height:40px; padding:0 11px;
    background:var(--surface); border:1px solid var(--border); border-radius:12px; color:var(--muted);
    box-shadow:var(--hair); transition:border-color .16s, box-shadow .16s;
  }
  .searchbar:focus-within { border-color:var(--brand-line); box-shadow:var(--ring); }
  @media (max-width:620px) {
    .topbar { gap:6px; padding:10px 12px; }
    .topbar .kbd { display:none; }
    .searchbar { min-width:0; }
    .topbar .grow { display:none; }
  }
  .searchbar input { flex:1; min-width:0; align-self:stretch; height:100%; border:0; background:transparent; outline:none; font-size:14px; }
  .searchbar input::placeholder { color:var(--faint); }
  .kbd { font-family:"IBM Plex Mono",monospace; font-size:10.5px; padding:2px 6px; border-radius:6px; background:var(--surface-3); color:var(--faint); border:1px solid var(--border); flex:none; }
  @media (max-width:520px) { .kbd { display:none; } }

  .content { flex:1; padding:18px 16px calc(var(--nav-h) + 34px); width:100%; max-width:1420px; margin:0 auto; }
  .cols { display:flex; flex-direction:column; gap:16px; }
  .rail { display:flex; flex-direction:column; gap:14px; }

  nav.tabs {
    position:fixed; left:0; right:0; bottom:0; z-index:35; display:flex;
    background:var(--glass); backdrop-filter:saturate(1.8) blur(18px);
    border-top:1px solid var(--border); padding-bottom:env(safe-area-inset-bottom,0px);
  }
  nav.tabs button { flex:1; height:var(--nav-h); display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px; color:var(--muted); font-size:12px; font-weight:700; position:relative; transition:color .18s; }
  nav.tabs button[aria-current="page"] { color:var(--brand); }
  nav.tabs button[aria-current="page"]::after { content:""; position:absolute; top:0; left:50%; transform:translateX(-50%); width:24px; height:2.5px; border-radius:0 0 4px 4px; background:var(--brand); box-shadow:0 0 10px var(--brand); }
  nav.tabs .nb { position:absolute; top:9px; right:calc(50% - 21px); min-width:16px; height:16px; padding:0 4px; border-radius:99px; background:var(--urgente); color:#fff; font-size:9.5px; font-weight:800; display:grid; place-items:center; box-shadow:0 0 0 2px var(--bg); }

  @media (min-width:1000px) {
    aside.side { display:flex; } nav.tabs { display:none; } .mlogo { display:none; }
    .content { padding:22px 26px 44px; } .topbar { padding:12px 26px; }
  }
  @media (min-width:1260px) {
    .cols { display:grid; grid-template-columns:minmax(0,1fr) var(--rail-w); gap:18px; align-items:start; }
    .rail { position:sticky; top:92px; }
  }

  /* ===== panel ===== */
  .panel { background:var(--surface); border:1px solid var(--border); border-radius:var(--r-lg); box-shadow:var(--sh-1),var(--hair); overflow:hidden; position:relative; }
  .panel-head { display:flex; align-items:center; gap:9px; padding:14px 16px 0; }
  .panel-head h2 { font-size:13.5px; font-weight:750; }
  .panel-head .sub { font-size:12.5px; color:var(--muted); font-weight:500; margin-top:1px; }
  .panel-head .link { margin-left:auto; font-size:12.5px; font-weight:700; color:var(--brand); display:inline-flex; align-items:center; gap:3px; padding:4px 7px; border-radius:8px; transition:background .15s; }
  .panel-head .link:hover { background:var(--brand-soft); }
  .panel-body { padding:12px 16px 16px; }
  .panel-body.tight { padding:9px 10px 11px; }
  .eyebrow { font-size:12px; font-weight:750; letter-spacing:.1em; text-transform:uppercase; color:var(--muted); }

  /* ===== hero ===== */
  .hero { position:relative; overflow:hidden; border-radius:var(--r-xl); border:1px solid var(--border); background:var(--surface); padding:22px; margin-bottom:16px; box-shadow:var(--sh-1),var(--hair); }
  .hero::before { content:""; position:absolute; inset:-55% -12% auto auto; width:460px; height:460px; border-radius:50%; background:radial-gradient(circle at 50% 50%,var(--brand-soft),transparent 66%); pointer-events:none; animation:flota 14s ease-in-out infinite; }
  .hero::after { content:""; position:absolute; right:-90px; top:-70px; width:320px; height:320px; border-radius:50%; border:1px solid var(--border-2); opacity:.45; pointer-events:none; }
  @keyframes flota { 0%,100% { transform:translate(0,0) scale(1); } 50% { transform:translate(-16px,12px) scale(1.06); } }
  .hero-in { position:relative; display:flex; flex-wrap:wrap; gap:16px; align-items:flex-end; }
  .hero .date { font-size:12px; color:var(--muted); font-weight:650; }
  .hero h1 { font-size:clamp(23px,4.6vw,32px); margin:5px 0 7px; font-weight:800; }
  .hero .resumen { font-size:14.5px; color:var(--ink-2); max-width:46ch; margin:0; }
  .hero .resumen b { color:var(--ink); font-weight:750; }
  .hero .resumen b.v { color:var(--urgente); }
  .plata { margin-left:auto; background:var(--surface-2); border:1px solid var(--border); border-radius:var(--r); padding:12px 15px; min-width:196px; box-shadow:var(--hair); }
  .plata .pl { font-size:12px; font-weight:750; letter-spacing:.07em; text-transform:uppercase; color:var(--muted); display:flex; align-items:center; gap:6px; }
  .plata .pv { font-size:16.5px; font-weight:750; font-variant-numeric:tabular-nums; margin-top:5px; line-height:1.35; }
  .plata .pn { font-size:12px; color:var(--muted); margin-top:5px; }

  /* ===== captura ===== */
  .capture { background:var(--surface); border:1px solid var(--border); border-radius:var(--r-lg); box-shadow:var(--sh-2),var(--hair); padding:13px; margin-bottom:16px; position:relative; transition:border-color .22s, box-shadow .22s; }
  .capture:focus-within { border-color:var(--brand-line); box-shadow:var(--ring),var(--sh-2); }
  .capture.drag { border-color:var(--brand); border-style:dashed; background:var(--brand-soft); }
  .cap-row { display:flex; gap:10px; align-items:flex-start; }
  .cap-row textarea { flex:1; min-width:0; border:0; background:transparent; resize:none; outline:none; min-height:46px; max-height:200px; font-size:16px; line-height:1.45; padding:10px 4px 4px; caret-color:var(--brand); color:var(--ink); -webkit-user-select:text; user-select:text; }
  .capture { cursor:text; }
  .cap-tools, .cap-send, .auto-linea { cursor:default; }
  .cap-row textarea::placeholder { color:var(--faint); }
  .cap-send { flex:none; height:44px; padding:0 19px; border-radius:13px; font-weight:750; font-size:14.5px; background:linear-gradient(140deg,var(--brand),var(--brand-2)); color:var(--brand-ink); display:inline-flex; align-items:center; gap:7px; align-self:flex-end; box-shadow:0 3px 16px var(--brand-soft), inset 0 1px 0 rgba(255,255,255,.25); transition:transform .14s, filter .18s, opacity .18s; }
  .cap-send:hover:not(:disabled) { filter:brightness(1.08); transform:translateY(-1.5px); }
  .cap-send:active:not(:disabled) { transform:scale(.97); }
  .cap-send:disabled { opacity:.32; cursor:not-allowed; }
  .cap-tools { display:flex; align-items:center; gap:7px; flex-wrap:wrap; margin-top:9px; padding-top:10px; border-top:1px solid var(--border); }
  @media (max-width:620px) {
    .cap-tools {
      flex-wrap:nowrap; overflow-x:auto; overflow-y:hidden; scrollbar-width:none;
      -webkit-overflow-scrolling:touch; scroll-snap-type:x proximity;
      margin-left:-2px; padding-left:2px; padding-right:2px;
      -webkit-mask-image:linear-gradient(90deg,#000 0,#000 calc(100% - 22px),transparent 100%);
      mask-image:linear-gradient(90deg,#000 0,#000 calc(100% - 22px),transparent 100%);
    }
    .cap-tools::-webkit-scrollbar { display:none; }
    .cap-tools > * { flex:0 0 auto; scroll-snap-align:start; }
    .cap-tools .grow { display:none; }
  }
  .auto-tag { display:inline-flex; align-items:center; gap:5px; font-size:11px; font-weight:650; color:var(--brand); background:var(--brand-soft); border:1px solid var(--brand-line); padding:3px 9px; border-radius:99px; animation:pop .3s cubic-bezier(.22,1.6,.4,1) both; }
  @keyframes pop { from { opacity:0; transform:scale(.86); } to { opacity:1; transform:scale(1); } }
  .auto-duda { display:inline-flex; align-items:center; gap:4px; color:var(--importante); font-weight:650; }
  .confirm-head { text-align:center; padding:6px 0 2px; }
  .confirm-paso { font-size:12px; font-weight:750; letter-spacing:.1em; text-transform:uppercase; color:var(--brand); }
  .confirm-q { font-size:clamp(21px,5.2vw,27px); font-weight:800; line-height:1.2; margin:9px 0 8px; text-wrap:balance; }
  .confirm-d { font-size:14px; color:var(--muted); margin:0 0 14px; }
  .confirm-cita { display:flex; flex-direction:column; gap:3px; background:var(--surface-2); border:1px solid var(--border); border-radius:var(--r); padding:11px 14px; font-size:12px; color:var(--muted); }
  .confirm-cita b { font-size:14.5px; color:var(--ink-2); font-weight:600; font-style:italic; }
  .confirm-ops { display:flex; flex-direction:column; gap:9px; }

  /* ===== filas ===== */

  /* ===== calendario ===== */

  /* ===== sheet ===== */

  .field { display:flex; flex-direction:column; }

    width:100%; padding:11px 13px; border-radius:12px; border:1px solid var(--border-2);

    { m:"USD", re:/(?:^|[^a-z])(?:u\$s|us\$|usd|dolar|dolares|dólar|dólares|verdes)(?:[^a-z]|$)/ },
    { m:"EUR", re:/(?:^|[^a-z])(?:eur|euro|euros)(?:[^a-z]|$)/ },
    { m:"ARS", re:/(?:^|[^a-z])(?:ars|peso|pesos|mangos)(?:[^a-z]|$)/ }
  ];
  function aCanonico(crudo) {
    var t = crudo.replace(/\s/g, "");
    var coma = t.lastIndexOf(","), punto = t.lastIndexOf(".");
    var ent, dec = "";
    if (coma >= 0 && punto >= 0) {
      if (coma > punto) { ent = t.slice(0, coma).replace(/\./g, ""); dec = t.slice(coma + 1); }
      else { ent = t.slice(0, punto).replace(/,/g, ""); dec = t.slice(punto + 1); }
    } else if (coma >= 0) {
      var dC = t.slice(coma + 1);
      if (dC.length === 3 && t.split(",").length > 2) { return null; }
      if (dC.length === 3) { ent = t.replace(/,/g, ""); }
      else if (dC.length === 1 || dC.length === 2) { ent = t.slice(0, coma); dec = dC; }
      else { return null; }
    } else if (punto >= 0) {
      var dP = t.slice(punto + 1);
      if (dP.length === 3) { ent = t.replace(/\./g, ""); }
      else if (dP.length === 1 || dP.length === 2) { ent = t.slice(0, punto); dec = dP; }
      else { return null; }
    } else { ent = t; }
    ent = ent.replace(/[^0-9]/g, "");
    dec = dec.replace(/[^0-9]/g, "");
    if (!ent || ent.length > 15) { return null; }
    if (dec.length > 2) { return null; }
    return String(parseInt(ent, 10)) + "." + (dec + "00").slice(0, 2);
  }
  function detectarImporte(texto) {
    var t = norm(texto);
    var moneda = null;
    for (var i = 0; i < K_MONEDA.length; i++) { if (K_MONEDA[i].re.test(t)) { moneda = K_MONEDA[i].m; break; } }
    if (!moneda) { return null; }
    var nums = t.match(/\d[\d.,]*/g) || [];
    var cand = null;
    for (var j = 0; j < nums.length; j++) {
      var crudo = nums[j].replace(/[.,]+$/, "");
      if (crudo.replace(/[^0-9]/g, "").length < 3) { continue; }
      var can = aCanonico(crudo);
      if (!can) { continue; }
      if (cand) { return null; }
      cand = { importe: can, moneda: moneda, crudo: crudo };
    }
    return cand;
  }
  function detectarTipo(texto) {
    var t = norm(texto).trim();
    if (!t) { return null; }
    for (var i = 0; i < F_NOTA.length; i++) { if (t.indexOf(norm(F_NOTA[i])) >= 0) { return "anotacion"; } }
    for (var j = 0; j < F_ACCION.length; j++) { if (t.indexOf(norm(F_ACCION[j])) >= 0) { return "actividad"; } }
    var prim = t.split(/[\s,.]+/)[0];
    if (V_ACCION.indexOf(prim) >= 0) { return "actividad"; }
    for (var k = 0; k < V_ACCION.length; k++) {
      var v = V_ACCION[k];
      if (v.length > 4 && new RegExp("(^|\\s)" + v + "(\\s|$)").test(t)) { return "actividad"; }
    }
    if (/^(el|la|los|las|mi|su)\s/.test(t) && /\ses\s|\sson\s|\stiene\s/.test(t)) { return "anotacion"; }
    return "actividad";
  }
  var NOMBRE_AREA = { logistica:"Logistica", logistico:"Logistica", operaciones:"Operaciones", operativa:"Operaciones", cheques:"Cheques", cheque:"Cheques" };
  function detectarArea(texto) {
    var t = norm(texto);
    if (!t) { return null; }
    var dicho = null;
    Object.keys(NOMBRE_AREA).forEach(function (k) {
      if (dicho) { return; }
      if (new RegExp("(^|[^a-z])" + k + "([^a-z]|$)").test(t)) { dicho = NOMBRE_AREA[k]; }
    });
    if (dicho) { return dicho; }
    var mejor = null, mejorN = 0;
    Object.keys(K_AREA).forEach(function (a) {
      var n = 0;
      K_AREA[a].forEach(function (k) { if (t.indexOf(norm(k)) >= 0) { n++; } });
      if (n > mejorN) { mejorN = n; mejor = a; }
    });
    return mejorN > 0 ? mejor : null;
  }


  /* ---------- fecha y hora dichas en el texto ---------- */
  var DIAS_SEM = { domingo:0, lunes:1, martes:2, miercoles:3, jueves:4, viernes:5, sabado:6 };
  var MESES_N = { enero:1, febrero:2, marzo:3, abril:4, mayo:5, junio:6, julio:7, agosto:8, septiembre:9, setiembre:9, octubre:10, noviembre:11, diciembre:12 };
  function isoDe(d) { return hoyISO(d); }
  function masDias(n) { var d = new Date(); d.setDate(d.getDate() + n); return isoDe(d); }
  function proximoDia(dow, incluirHoy) {
    var d = new Date(), hoyD = d.getDay();
    var delta = (dow - hoyD + 7) % 7;
    if (delta === 0 && !incluirHoy) { delta = 7; }
    d.setDate(d.getDate() + delta);
    return isoDe(d);
  }
  function armarISO(dia, mes, anio) {
    var y = anio || new Date().getFullYear();
    return y + "-" + String(mes).padStart(2, "0") + "-" + String(dia).padStart(2, "0");
  }
  function detectarFechaHora(texto) {
    var t = norm(texto);
    var out = { fecha: null, hora: null, dudas: [], dijoHora: false, dijoFecha: false };

    /* --- hora --- */
    var mh = t.match(/\ba\s+las?\s+(\d{1,2})(?:[:.h](\d{2}))?(?!\d)/)
      || t.match(/\b(\d{1,2}):(\d{2})(?!\d)/)
      || t.match(/\b(\d{1,2})[.h](\d{2})\s*(?:hs?\b|horas?\b)/)
      || t.match(/\b(\d{1,2})\s*(?:hs\b|horas\b)/);
    if (mh) {
      var h = parseInt(mh[1], 10), mm = mh[2] ? parseInt(mh[2], 10) : 0;
      if (h >= 0 && h <= 23 && mm >= 0 && mm <= 59) {
        out.dijoHora = true;
        var esAM = /de la ma(n|ñ)ana|\bam\b|de la madrugada/.test(t);
        var esPM = /de la tarde|de la noche|\bpm\b|al mediodia/.test(t);
        if (esPM && h < 12) { h += 12; }
        else if (esAM && h === 12) { h = 0; }
        else if (!esAM && !esPM && h >= 1 && h <= 11 && !mh[2]) {
          out.dudas.push({
            clave: "hora",
            titulo: "¿A las " + h + " de la mañana o de la tarde?",
            detalle: "Dijiste «a las " + h + "» y no queda claro cuál de las dos.",
            opciones: [
              { l: String(h).padStart(2, "0") + ":00 de la mañana", v: String(h).padStart(2, "0") + ":00" },
              { l: String(h + 12) + ":00 de la tarde", v: String(h + 12) + ":00" }
            ],
            manual: "hora"
          });
          h = null;
        }
        if (h !== null) { out.hora = String(h).padStart(2, "0") + ":" + String(mm).padStart(2, "0"); }
      }
    }
    if (out.hora && /\by\s+media\b/.test(t)) {
      var ph2 = out.hora.split(":");
      out.hora = ph2[0] + ":30";
    } else if (out.hora && /\by\s+cuarto\b/.test(t)) {
      var ph3 = out.hora.split(":");
      out.hora = ph3[0] + ":15";
    }
    if (/\bmediodia\b/.test(t) && !out.hora) { out.hora = "12:00"; out.dijoHora = true; }
    if (/\bmedianoche\b/.test(t) && !out.hora) { out.hora = "00:00"; out.dijoHora = true; }

    /* --- relativo: en X horas / minutos --- */
    var mr = t.match(/\ben\s+(un|una|\d{1,3})\s*(hora|horas|hs|h|minuto|minutos|min|mins)\b/);
    if (mr) {
      var cant = (mr[1] === "un" || mr[1] === "una") ? 1 : parseInt(mr[1], 10);
      var esMin = /^min/.test(mr[2]);
      var d0 = new Date();
      d0.setMinutes(d0.getMinutes() + (esMin ? cant : cant * 60));
      out.fecha = isoDe(d0);
      out.hora = String(d0.getHours()).padStart(2, "0") + ":" + String(d0.getMinutes()).padStart(2, "0");
      out.dijoFecha = true; out.dijoHora = true;
      out.dudas = out.dudas.filter(function (x) { return x.clave !== "hora"; });
      return out;
    }

    /* --- fecha --- */
    var m;
    if (/\bhoy\b/.test(t)) { out.fecha = hoyISO(); out.dijoFecha = true; }
    else if (/\bpasado\s*ma(n|ñ)ana\b/.test(t)) { out.fecha = masDias(2); out.dijoFecha = true; }
    else if (/(^|[^a-z])ma(n|ñ)ana\b/.test(t) && !/de la ma(n|ñ)ana/.test(t)) { out.fecha = masDias(1); out.dijoFecha = true; }
    else if ((m = t.match(/\ben\s+(\d{1,2})\s+d[ií]as?\b/))) { out.fecha = masDias(parseInt(m[1], 10)); out.dijoFecha = true; }
    else if (/\b(la\s+)?semana\s+que\s+viene\b|\bproxima\s+semana\b/.test(t)) { out.fecha = masDias(7); out.dijoFecha = true; }
    else if ((m = t.match(/\b(\d{1,2})\s*\/\s*(\d{1,2})(?:\s*\/\s*(\d{2,4}))?/))) {
      var an = m[3] ? (m[3].length === 2 ? 2000 + parseInt(m[3], 10) : parseInt(m[3], 10)) : null;
      out.fecha = armarISO(parseInt(m[1], 10), parseInt(m[2], 10), an); out.dijoFecha = true;
    }
    else if ((m = t.match(/\b(\d{1,2})\s+de\s+([a-z]+)/)) && MESES_N[m[2]]) {
      out.fecha = armarISO(parseInt(m[1], 10), MESES_N[m[2]], null); out.dijoFecha = true;
    }
    else if ((m = t.match(/\b(lunes|martes|miercoles|jueves|viernes|sabado|domingo)\b/))) {
      var dow = DIAS_SEM[m[1]];
      out.dijoFecha = true;
      if (new Date().getDay() === dow) {
        out.dudas.push({
          clave: "fecha",
          titulo: "¿Este " + m[1] + " o el que viene?",
          detalle: "Hoy es " + m[1] + ", así que puede ser cualquiera de los dos.",
          opciones: [
            { l: "Hoy", v: hoyISO() },
            { l: "El " + m[1] + " que viene", v: proximoDia(dow, false) }
          ],
          manual: "fecha"
        });
      } else { out.fecha = proximoDia(dow, false); }
    }
    else if ((m = t.match(/\bel\s+(\d{1,2})\b/))) {
      var dia = parseInt(m[1], 10);
      if (dia >= 1 && dia <= 31) {
        out.dijoFecha = true;
        var hoyD = new Date(), esteMes = armarISO(dia, hoyD.getMonth() + 1, hoyD.getFullYear());
        var sig = new Date(hoyD.getFullYear(), hoyD.getMonth() + 1, 1);
        var proxMes = armarISO(dia, sig.getMonth() + 1, sig.getFullYear());
        out.dudas.push({
          clave: "fecha",
          titulo: "¿El " + dia + " de qué mes?",
          detalle: "Dijiste «el " + dia + "» sin decir el mes.",
          opciones: [
            { l: "El " + dia + " de " + hoyD.toLocaleDateString("es-AR", { month: "long" }), v: esteMes },
            { l: "El " + dia + " de " + sig.toLocaleDateString("es-AR", { month: "long" }), v: proxMes }
          ],
          manual: "fecha"
        });
      }
    }

    /* fecha explícita que ya pasó */
    if (out.fecha && out.fecha < hoyISO() && !out.dudas.some(function (d) { return d.clave === "fecha"; })) {
      var pz = out.fecha.split("-");
      var sigAnio = (parseInt(pz[0], 10) + 1) + "-" + pz[1] + "-" + pz[2];
      var leg = function (iso) { var q = iso.split("-"); return q[2] + "/" + q[1] + "/" + q[0]; };
      out.dudas.push({
        clave: "fecha",
        titulo: "Esa fecha ya pasó. ¿Cuál era?",
        detalle: "El " + leg(out.fecha) + " quedó atrás.",
        opciones: [
          { l: "El " + leg(out.fecha) + " (ya pasó, queda vencida)", v: out.fecha },
          { l: "El " + leg(sigAnio), v: sigAnio }
        ],
        manual: "fecha"
      });
      out.fecha = null;
    }

    /* hora dicha sin ningún día */
    if (out.dijoHora && !out.dijoFecha) {
      out.dudas.push({
        clave: "fecha",
        titulo: out.hora ? "¿Qué día, a las " + out.hora + "?" : "¿Qué día es?",
        detalle: "Pusiste la hora pero no el día.",
        opciones: [{ l: "Hoy", v: hoyISO() }, { l: "Mañana", v: masDias(1) }],
        manual: "fecha",
        permiteSinFecha: true
      });
    }
    return out;
  }

  /* ---------- pantalla grande de confirmación ---------- */
  function preguntarDudas(it, dudas, i, onFin) {
    if (i >= dudas.length) { onFin(); return; }
    var d = dudas[i];
    abrirSheet("Necesito confirmar algo", function (b) {
      var head = el("div", "confirm-head");
      var pasos = el("div", "confirm-paso", dudas.length > 1 ? "Pregunta " + (i + 1) + " de " + dudas.length : "Una sola pregunta");
      head.appendChild(pasos);
      head.appendChild(el("h2", "confirm-q", d.titulo));
      head.appendChild(el("p", "confirm-d", d.detalle));
      var cita = el("div", "confirm-cita");
      cita.innerHTML = "<span>Vos escribiste</span>";
      cita.appendChild(el("b", null, "“" + it.titulo + "”"));
      head.appendChild(cita);
      b.appendChild(head);

      var ops = el("div", "confirm-ops");
      d.opciones.forEach(function (o) {

        bb.appendChild(el("span", "co-l", o.l));
        bb.innerHTML += ic("chev", "sm");
        bb.onclick = function () {
          if (d.clave === "fecha") { it.fecha = o.v; }
          else if (d.clave === "hora") { it.hora = o.v; }
          else if (d.clave === "tipo") { aplicarTipo(it, o.v); }
          else if (d.clave === "importe") { if (o.v) { it.importe = o.v.importe; it.moneda = o.v.moneda; } }
          preguntarDudas(it, dudas, i + 1, onFin);
        };
        ops.appendChild(bb);
      });

      if (d.manual) {
      var otra = el("button", "confirm-op otra");
      otra.appendChild(el("span", "co-l", d.manual === "hora" ? "Otra hora" : "Otra fecha"));
      otra.innerHTML += ic("lapiz", "sm");
      var caja = el("div", "confirm-manual"); caja.hidden = true;
      var inp = el("input");
      inp.type = d.manual === "hora" ? "time" : "date";
      var okb = el("button", "btn primary", "Usar esta");
      okb.onclick = function () {
        if (!inp.value) { toast("Elegí una opción."); return; }
        if (d.manual === "hora") { it.hora = inp.value; } else { it.fecha = inp.value; }
        preguntarDudas(it, dudas, i + 1, onFin);
      };
      caja.appendChild(inp); caja.appendChild(okb);
      otra.onclick = function () { caja.hidden = false; otra.hidden = true; setTimeout(function () { inp.focus(); }, 60); };
      ops.appendChild(otra); ops.appendChild(caja);
      }

      if (d.permiteSinFecha) {
        var sf = el("button", "confirm-skip", "Guardar sin fecha");
        sf.onclick = function () { it.fecha = null; it.hora = null; preguntarDudas(it, dudas, i + 1, onFin); };
        ops.appendChild(sf);
      }
      b.appendChild(ops);
      b.appendChild(el("p", "hint", d.clave === "importe"
        ? "Hasta que no contestes, esto no se guarda. Nunca anotamos un monto que no confirmaste."
        : "Hasta que no contestes, esto no se guarda. Nunca ponemos una fecha que no dijiste."));
    });
  }
  function aplicarTipo(it, v) {
    it.tipo = v;
    if (v === "anotacion") { it.estado = null; it.prioridad = null; it.fecha = null; it.hora = null; it.recordatorios = []; }
    else { it.estado = it.estado || "Pendiente"; it.prioridad = it.prioridad || "Normal"; }
  }


  /* ---------- almacén propio del teléfono (no hace falta Claude) ---------- */
  function almacenLocal() {
    var NOMBRE = "asistente-operativo-v1";
    var COLS = ["items", "personas", "respaldos"];
    var cache = { items: {}, personas: {}, respaldos: {} };
    var subs = { items: [], personas: [], respaldos: [] };
    var idb = null, listo = null, modo = "memoria";

    function abrirIDB() {
      return new Promise(function (res, rej) {
        if (!window.indexedDB) { rej(new Error("sin-idb")); return; }
        var r;
        try { r = indexedDB.open(NOMBRE, 1); } catch (e) { rej(e); return; }
        r.onupgradeneeded = function () {
          var d = r.result;
          if (!d.objectStoreNames.contains("docs")) { d.createObjectStore("docs"); }
        };
        r.onsuccess = function () { res(r.result); };
        r.onerror = function () { rej(r.error || new Error("idb")); };
        r.onblocked = function () { rej(new Error("idb-bloqueada")); };
      });
    }
    function todosIDB() {
      return new Promise(function (res, rej) {
        var tx = idb.transaction("docs", "readonly");
        var st = tx.objectStore("docs");
        var out = {};
        var rq = st.openCursor();
        rq.onsuccess = function () {
          var c = rq.result;
          if (!c) { res(out); return; }
          out[c.key] = c.value; c.continue();
        };
        rq.onerror = function () { rej(rq.error); };
      });
    }
    function ponerIDB(path, datos) {
      return new Promise(function (res, rej) {
        var tx = idb.transaction("docs", "readwrite");
        tx.objectStore("docs").put(datos, path);
        tx.oncomplete = function () { res(); };
        tx.onerror = function () { rej(tx.error); };
      });
    }
    function sacarIDB(path) {
      return new Promise(function (res, rej) {
        var tx = idb.transaction("docs", "readwrite");
        tx.objectStore("docs").delete(path);
        tx.oncomplete = function () { res(); };
        tx.onerror = function () { rej(tx.error); };
      });
    }
    function leerLS() {
      try {
        var crudo = localStorage.getItem(NOMBRE);
        return crudo ? JSON.parse(crudo) : {};
      } catch (e) { return {}; }
    }
    function guardarLS() {
      var plano = {};
      COLS.forEach(function (c) {
        Object.keys(cache[c]).forEach(function (id) { plano[c + "/" + id] = cache[c][id]; });
      });
      try { localStorage.setItem(NOMBRE, JSON.stringify(plano)); return true; }
      catch (e) { return false; }
    }
    function meter(plano) {
      Object.keys(plano).forEach(function (path) {
        var p = path.split("/");
        if (COLS.indexOf(p[0]) < 0 || !p[1]) { return; }
        cache[p[0]][p[1]] = plano[path];
      });
    }
    function snap(col) {
      var ids = Object.keys(cache[col]);
      return { docs: ids.map(function (id) {
        var v = cache[col][id];
        return { id: id, data: function () { return v; } };
      }) };
    }
    function avisar(col) {
      subs[col].forEach(function (fn) { try { fn(snap(col)); } catch (e) {} });
    }

    function arrancarAlmacen() {
      if (listo) { return listo; }
      listo = abrirIDB().then(function (d) {
        idb = d; modo = "indexeddb";
        return todosIDB();
      }).then(function (plano) {
        meter(plano);
        var viejo = leerLS();
        if (Object.keys(plano).length === 0 && Object.keys(viejo).length) {
          meter(viejo);
          return Promise.all(Object.keys(viejo).map(function (p) { return ponerIDB(p, viejo[p]); }));
        }
      }).catch(function () {
        modo = "navegador";
        meter(leerLS());
      });
      return listo;
    }

    return {
      modo: function () { return modo; },
      arrancar: arrancarAlmacen,
      collection: function (col) {
        return { onSnapshot: function (fn) {
          subs[col].push(fn);
          arrancarAlmacen().then(function () { fn(snap(col)); });
          return function () { subs[col] = subs[col].filter(function (x) { return x !== fn; }); };
        } };
      },
      doc: function (path) {
        var p = path.split("/"), col = p[0], id = p[1];
        return {
          set: function (datos) {
            return arrancarAlmacen().then(function () {
              var copia = JSON.parse(JSON.stringify(datos));
              cache[col][id] = copia;
              avisar(col);
              if (modo === "indexeddb") {
                return ponerIDB(path, copia).catch(function () {
                  if (!guardarLS()) { throw new Error("sin-espacio"); }
                });
              }
              if (!guardarLS()) { throw new Error("sin-espacio"); }
            });
          },
          delete: function () {
            return arrancarAlmacen().then(function () {
              delete cache[col][id];
              avisar(col);
              if (modo === "indexeddb") { return sacarIDB(path).catch(function () { guardarLS(); }); }
              guardarLS();
            });
          }
        };
      }
    };
  }

  /* adjuntos guardados en el propio teléfono, como texto */
  function assetsLocal() {
    return {
      upload: function (file) {
        return new Promise(function (res, rej) {
          if (file.size > 4 * 1024 * 1024) { rej(new Error("muy-grande")); return; }
          var fr = new FileReader();
          fr.onload = function () {
            res({ id: "l" + Date.now().toString(36) + Math.random().toString(36).slice(2, 7),
                  url: String(fr.result), sizeBytes: file.size, contentType: file.type });
          };
          fr.onerror = function () { rej(fr.error || new Error("lectura")); };
          fr.readAsDataURL(file);
        });
      }
    };
  }
  function downloadsLocal() {
    return { save: function (o) {
      return new Promise(function (res, rej) {
        try {
          var b = new Blob([o.data], { type: "application/json" });
          var u = URL.createObjectURL(b);
          var a = document.createElement("a");
          a.href = u; a.download = o.filename;
          document.body.appendChild(a); a.click();
          setTimeout(function () { document.body.removeChild(a); URL.revokeObjectURL(u); }, 400);
          res();
        } catch (e) { rej(e); }
      });
    } };
  }

  /* ---------- almacén ---------- */
  var colas = {};
  function guardarSoloLocal(col, id, datos) {

  /* ---------- adjuntos ---------- */
  function achicarImagen(file) {
    return new Promise(function (res) {
      if (!/^image\//.test(file.type) || /svg/.test(file.type)) { res(file); return; }
      var img = new Image(), url = URL.createObjectURL(file);
      img.onload = function () {
        var max = 2000, w = img.width, h = img.height;
        if (w <= max && h <= max) { URL.revokeObjectURL(url); res(file); return; }
        var r = Math.min(max / w, max / h), c = document.createElement("canvas");
        c.width = Math.round(w * r); c.height = Math.round(h * r);
        c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
        c.toBlob(function (b) {
          URL.revokeObjectURL(url);
          res(b ? new File([b], file.name.replace(/\.\w+$/, "") + ".jpg", { type: "image/jpeg" }) : file);
        }, "image/jpeg", 0.85);
      };
      img.onerror = function () { URL.revokeObjectURL(url); res(file); };
      img.src = url;
    });
  }
  async function subirAdjuntos(it, files, cb) {
    if (!S.assets) {
      toast("Este navegador no deja guardar archivos.");
      return;
    }
    var libres = MAX_ADJ - (it.adjuntos || []).length;
    if (libres <= 0) { toast("Ya tenés " + MAX_ADJ + " archivos acá, que es el máximo."); return; }
    var lista = Array.prototype.slice.call(files, 0, libres);
    var subidos = 0;
    for (var i = 0; i < lista.length; i++) {
      var f = lista[i];
      if (!/^image\//.test(f.type) && f.type !== "application/pdf") { toast("«" + (f.name || "ese archivo") + "» no se puede: solo fotos y PDF."); continue; }
      if (f.size > MAX_MB * 1024 * 1024) { toast("«" + f.name + "» pesa más de " + MAX_MB + " MB. Probá con una foto más chica."); continue; }
      try {
        toast("Subiendo " + (f.name || "archivo") + "… (" + (i + 1) + " de " + lista.length + ")", null, null, 30000);
        var chico = await achicarImagen(f);
        var r = await S.assets.upload(chico);
        it.adjuntos = (it.adjuntos || []).concat([{ id: r.id, url: r.url, nombre: f.name || "archivo", tipo: r.contentType || chico.type, bytes: r.sizeBytes || chico.size }]);
        await guardarItem(it, "Adjunto agregado");
        subidos++;
        if (cb) { cb(); }
      } catch (e) {
        var c = codigo(e);
        toast(c === "muy-grande" ? "Esa foto pesa más de 4 MB. Sacala más chica o mandá un PDF." : "No se pudo guardar el archivo. Probá de nuevo.", null, null, 6000);
        return;
      }
    }
    if (subidos) { toast(subidos === 1 ? "Adjunto guardado" : subidos + " adjuntos guardados"); }
    else { ocultarToast(); }
  }
  function archivosDe(dt) {

        var w0 = el("div");
        w0.appendChild(el("strong", null, "Respaldo activado"));
        w0.appendChild(el("span", null, "Entraste como " + (SB.user.email || "vos") + ". Todo lo que anotás se guarda solo, y aparece igual en tus otros dispositivos."));
        ok.appendChild(w0);
        b.appendChild(ok);
        var us = ultimaSincro();
        b.appendChild(el("p", "hint", us ? "Última sincronización: " + fmtCuando(us) : "Sincronizando…"));
        var sal = el("button", "btn danger", "Salir de esta cuenta");
        sal.onclick = async function () {
          if (!confirm("Vas a salir.\n\nLo que ya está anotado queda en este teléfono, pero deja de guardarse solo.\n\n¿Seguimos?")) { return; }
          try { await SB.cli.auth.signOut(); } catch (e) {}
          canalNube = null; cerrarSheet(); render();
        };
        pie7(foot, sal);
        var list = el("button", "btn primary", "Listo");
        list.onclick = cerrarSheet;
        pie7(foot, list);
        return;
      }
      b.appendChild(el("p", "hint", "Poné tu mail y te mandamos un correo con un botón para entrar. Lo tocás una vez y listo: desde ahí todo se guarda solo y lo ves igual en el celular y en la computadora."));
      var mi = el("input"); mi.type = "email"; mi.id = "sb-mail";
      mi.placeholder = "tumail@ejemplo.com";
      mi.setAttribute("autocapitalize", "off"); mi.setAttribute("autocorrect", "off");
      mi.inputMode = "email";
      campo(b, "Tu mail", mi);
      var est = el("p", "hint", ""); b.appendChild(est);

      var bEnv = el("button", "btn primary");
      bEnv.innerHTML = ic("check", "sm") + "<span>Mandame el correo</span>";
      bEnv.onclick = async function () {
        var mail = mi.value.trim();
        if (!mail || mail.indexOf("@") < 0) { est.className = "hint err"; est.textContent = "Escribí un mail válido."; mi.focus(); return; }
        if (!SB.cli) { est.className = "hint err"; est.textContent = "Sin conexión. Probá de nuevo cuando tengas internet."; return; }
        est.className = "hint"; est.textContent = "Mandando…";
        bEnv.disabled = true;
        try {
          var r = await SB.cli.auth.signInWithOtp({
            email: mail,
            options: { shouldCreateUser: true, emailRedirectTo: location.origin + location.pathname }
          });
          if (r.error) { throw r.error; }
          est.className = "hint";
          est.textContent = "Listo. Te mandamos un correo a " + mail + ". Abrilo desde ESTE MISMO navegador y tocá el botón para entrar. Puede tardar un minuto; mirá también el correo no deseado.";
          bEnv.innerHTML = "<span>Volver a mandar</span>";
          bEnv.disabled = false;
        } catch (e) {
          est.className = "hint err";
          est.textContent = "No se pudo mandar: " + ((e && e.message) || "error");
          bEnv.disabled = false;
        }
      };
      pie7(foot, bEnv);

      var bCer = el("button", "btn", "Cerrar");
      bCer.onclick = cerrarSheet;
      pie7(foot, bCer);
    });
  }

  function banderaNube(main2) {
    if (SB.estado === "sin-configurar") { return; }
    if (nubeActiva()) { return; }
    var bn = el("div", "banner warn");
    bn.style.cursor = "pointer";
    bn.innerHTML = ic("descarga", "sm");
    var w = el("div");
    w.appendChild(el("strong", null, "Guardado solo en este dispositivo"));
    w.appendChild(el("span", null, "Tocá acá para activar el respaldo automático y ver lo mismo en el celular y en la computadora."));
    bn.appendChild(w);
    bn.onclick = pantallaEntrar;
    main2.appendChild(bn);
  }

  window.addEventListener("online", function () { if (nubeActiva()) { sincronizar(false); } });
  setInterval(function () { if (nubeActiva() && !S.sheet) { sincronizar(false); } }, 120000);

  /* ---------- volver a cargar una copia guardada ---------- */
  function importar() {
    abrirSheet("Restaurar una copia", function (b, foot) {
      b.appendChild(el("p", "hint", "Elegí el archivo que bajaste con «Guardar una copia». Lo que ya tengas acá se mantiene; lo que venga en la copia se agrega o se actualiza."));
      var inp = el("input", "vh");
      inp.type = "file"; inp.accept = "application/json,.json";
      inp.setAttribute("aria-label", "Elegir el archivo de la copia");
      inp.tabIndex = -1;
      b.appendChild(inp);
      var dz = el("div", "dropzone");
      dz.innerHTML = ic("descarga", "sm") + "<div style='margin-top:5px'>Tocá acá para elegir el archivo</div>";
      dz.tabIndex = 0; dz.setAttribute("role", "button");
      dz.onclick = function () { inp.click(); };
      dz.onkeydown = function (e) { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); inp.click(); } };
      b.appendChild(dz);
      var est = el("p", "hint", "");
      b.appendChild(est);
      inp.onchange = function () {
        var f = (inp.files || [])[0];
        if (!f) { return; }
        est.className = "hint"; est.textContent = "Leyendo «" + f.name + "»…";
        var fr = new FileReader();
        fr.onerror = function () { est.className = "hint err"; est.textContent = "No se pudo leer el archivo."; };
        fr.onload = function () {
          var d;
          try { d = JSON.parse(String(fr.result)); } catch (e) {
            est.className = "hint err";
            est.textContent = "Ese archivo no es una copia del asistente.";
            return;
          }
          if (!d || (!Array.isArray(d.items) && !Array.isArray(d.personas))) {
            est.className = "hint err";
            est.textContent = "Ese archivo no tiene actividades ni personas adentro.";
            return;
          }
          var its = Array.isArray(d.items) ? d.items : [];
          var pers = Array.isArray(d.personas) ? d.personas : [];
          est.className = "hint";
          est.textContent = "Encontré " + its.length + (its.length === 1 ? " cosa" : " cosas") + " y " + pers.length + (pers.length === 1 ? " persona" : " personas") + ". Guardando…";
          var tareas = [];
          pers.forEach(function (p) { if (p && p.id) { S.personas.set(p.id, p); tareas.push(escribir("personas/" + p.id, p)); } });
          its.forEach(function (i) { if (i && i.id) { S.items.set(i.id, i); tareas.push(escribir("items/" + i.id, i)); } });
          Promise.all(tareas).then(function () {
            cerrarSheet(); render();
            toast("Copia restaurada: " + its.length + " + " + pers.length);
          }).catch(function () {
            est.className = "hint err";
            est.textContent = "Se guardó solo una parte. Probá de nuevo.";
          });
        };
        fr.readAsText(f);
      };
    });
  }

  /* ---------- menú y atajos ---------- */
  function menuMas() {
    abrirSheet("Más", function (b) {
      [
        ["Anotaciones", "nota", function () { cerrarSheet(); S.view = "anotaciones"; render(); }],
        ["Historial", "reloj", function () { cerrarSheet(); S.view = "historial"; render(); }],
        ["Nueva persona", "gente", function () { editarPersona(null); }],
        ["Guardar una copia de todo", "descarga", function () { cerrarSheet(); exportar(); }],
        ["Restaurar una copia", "caja", function () { importar(); }],
        ["Copias automáticas", "reloj", function () { verRespaldos(); }],
        ["Respaldo automático y sincronización", "caja", function () { pantallaEntrar(); }],
        [S.tema === "dark" ? "Cambiar a modo claro" : "Cambiar a modo oscuro", S.tema === "dark" ? "sol" : "luna", function () { aplicarTema(S.tema === "dark" ? "light" : "dark"); cerrarSheet(); }]
      ].forEach(function (o) {
        var bb = el("button", "btn full");
        bb.style.justifyContent = "flex-start";
        bb.innerHTML = ic(o[1], "sm") + "<span>" + o[0] + "</span>";
        bb.onclick = o[2];
        b.appendChild(bb);
      });
      b.appendChild(el("p", "hint", "Todo se guarda en este teléfono. Si borrás los datos del navegador, se pierde. Guardá una copia cada tanto con «Guardar una copia»."));
    });
  }
  $("#sheet-close").innerHTML = ic("x");
  $("#btn-export").innerHTML = ic("descarga");
  $("#btn-menu").innerHTML = ic("puntos");
  $("#sheet-close").addEventListener("click", cerrarSheet);
  $("#scrim").addEventListener("click", cerrarSheet);
  $("#btn-menu").addEventListener("click", menuMas);
  $("#btn-export").addEventListener("click", exportar);
  $("#btn-tema").addEventListener("click", function () { aplicarTema(S.tema === "dark" ? "light" : "dark"); });

  var qi = $("#q-global");
  qi.addEventListener("input", function () {
    var antes = S.q;
    S.q = qi.value;
    if (S.q && !antes) { S.filtro = "todas"; }
    if (S.q && S.view !== "actividades" && S.view !== "personas" && S.view !== "anotaciones") { S.view = "actividades"; S.filtro = "todas"; }
    render();
  });
  document.addEventListener("keydown", function (e) {
    var k = (e.key || "").toLowerCase();
    if ((e.metaKey || e.ctrlKey) && k === "k") { e.preventDefault(); qi.focus(); qi.select(); return; }
    if (e.key === "Escape") { if (S.sheet) { cerrarSheet(); } else if (document.activeElement === qi) { qi.blur(); } return; }
    if ((e.metaKey || e.ctrlKey) && k === "n") {
      e.preventDefault();
      if (S.view !== "inicio") { S.view = "inicio"; render(); }
      irACaptura();
    }
  });
  window.addEventListener("resize", function () { var s = $("#seg-tipo"); if (s) { moverThumb(s); } });

  /* ---------- arranque ---------- */
  function esqueleto() {
    try { if (window.__arranqueOk) { window.__arranqueOk(); } } catch (e) {}
    main.innerHTML = "";
    var w = el("div");
    w.style.cssText = "padding-top:10px;display:flex;flex-direction:column;gap:12px";
    ["102px", "128px", "70px", "70px", "70px"].forEach(function (h) {
      var s = el("div", "skel"); s.style.height = h; w.appendChild(s);
    });
    main.appendChild(w);
  }
  async function arrancar() {
    aplicarTema(leerTema());
    esqueleto();
    var db = almacenLocal();
    S.assets = assetsLocal();
    S.downloads = downloadsLocal();
    try { await db.arrancar(); } catch (e) {}
    S.modoAlmacen = db.modo();
    if (S.modoAlmacen === "memoria") {
      S.errorDb = "Este navegador no deja guardar nada. Probá con Chrome o Safari, sin modo incógnito.";
    } else if (S.modoAlmacen === "navegador") {
      S.errorDb = null;
    }
    db.collection("respaldos").onSnapshot(function (snap) {
      S.respaldos = snap.docs.map(function (d) { var o = d.data() || {}; o.id = d.id; return o; });
    }, function () {});
    S.db = db;
    var okI = false, okP = false;
    function listoQuiza() {
      if (S.listo) { render(); return; }
      if (okI && okP) { S.listo = true; render(); revisarVencidas(); setTimeout(respaldoDelDia, 1500); setTimeout(nubeArrancar, 300); }
    }
    db.collection("items").onSnapshot(function (snap) {
      S.items = new Map();
      snap.docs.forEach(function (d) {
        try { var o = clonarDoc(d); S.items.set(o.id, o); } catch (e) {}
      });
      okI = true; listoQuiza();
    }, function (e) {
      S.errorDb = "Se cortó la conexión. Recargá la página y volvé a probar. (" + codigo(e) + ")";
      S.listo = true; render();
    });
    db.collection("personas").onSnapshot(function (snap) {
      S.personas = new Map();
      snap.docs.forEach(function (d) {
        try { var o = clonarDoc(d); S.personas.set(o.id, o); } catch (e) {}
      });
      okP = true; listoQuiza();
    }, function () { okP = true; listoQuiza(); });
    setTimeout(function () { if (!S.listo) { S.listo = true; render(); } }, 6000);
  }
  arrancar();
})();
</script>

</body>
